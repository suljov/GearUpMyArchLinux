###################
# WAYBAR EFFECTS
###################

layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0.3, match:namespace waybar

###################
# NOCTALIA EFFECTS
###################

layerrule {
  name = noctalia
  match:namespace = noctalia-background-.*$
  ignore_alpha = 0.5
  blur = true
  blur_popups = true
}
