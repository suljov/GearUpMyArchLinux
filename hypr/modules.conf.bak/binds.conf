$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
#$menu = rofi -show drun
$menu = dms ipc call spotlight toggle
$ipc = qs -c noctalia-shell ipc call

###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Core
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
#bind = $mainMod, D, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle
bind = $mainMod, space, togglefloating,
bind = $mainMod, space, centerwindow,

# Fullscreen / Maximize
bind = $mainMod, F, fullscreen, 1          # maximize (keeps gaps)
bind = $mainMod SHIFT, F, fullscreen, 0    # true fullscreen

# Center floating window
bind = $mainMod, C, centerwindow,
# Pin window (show on all workspaces)
bind = $mainMod, Z, pin,

# Wallpaper changer rofi
#bind = $mainMod, W, exec, ~/.config/rofi/awww.sh
bind = $shiftMod, T, exec, ~/.config/colorschemes/theme-switcher.sh
bind = $mainMod, period, exec, rofimoji --action clipboard

### Dms shell ###
#bind = $mainMod, D, exec, $menu
#bind = $mainMod, W, exec, dms ipc wallpaperCarousel toggle
#bind = $mainMod, comma, exec, dms ipc call settings toggle

### Noctalia shell ###
# Core binds
bind = SUPER, D, exec, $ipc launcher toggle
bind = SUPER, R, exec, $ipc controlCenter toggle
bind = SUPER, comma, exec, $ipc settings toggle
# Noctalia Wallpaper Switcher
bind = $mainMod, W, exec, qs -c noctalia-shell ipc call plugin:wallcards toggle

# Screenshot (Hyprshot)
bind = $shiftMod, W, exec, hyprshot -m window
bind = $shiftMod, F, exec, hyprshot -m output
bind = $shiftMod, S, exec, hyprshot -z -m region --raw | satty --filename -
#bind = $shiftMod, S, exec, flameshot full

# Navigation And Focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, bracketright, workspace, e+1
bind = $mainMod, bracketleft, workspace, e-1

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Resize Submap
bind = $mainMod, T, submap, resize
submap = resize
binde = , right, resizeactive, 10 0
binde = , left, resizeactive, -10 0
binde = , up, resizeactive, 0 -10
binde = , down, resizeactive, 0 10
bind = , escape, submap, reset
submap = reset
